name: Packaging

on:
  # Triggered after Release workflow completes, so release assets exist.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    # Only run when the triggering Release workflow succeeded (tag runs),
    # or on manual dispatch. Skips branch-push releases of the Release workflow.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: package ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_branch }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "TAG=$TAG" >>"$GITHUB_ENV"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >>"$GITHUB_ENV"

      - name: Download release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # act compatibility: fetch with curl when gh is unavailable
          if command -v gh >/dev/null 2>&1; then
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "clashtui-linux-${{ matrix.arch }}-$TAG.gz" \
              --clobber
          else
            curl -sSfLO "https://github.com/${{ github.repository }}/releases/download/$TAG/clashtui-linux-${{ matrix.arch }}-$TAG.gz"
          fi
          gunzip "clashtui-linux-${{ matrix.arch }}-$TAG.gz"
          BIN="clashtui-linux-${{ matrix.arch }}-$TAG"
          [ -f "$BIN" ] || { echo "binary not found: $BIN" >&2; exit 1; }
          chmod +x "$BIN"
          echo "BIN=$BIN" >>"$GITHUB_ENV"

      - name: Install fpm
        run: |
          if ! command -v gem >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ruby ruby-dev
          fi
          # fpm needs rpmbuild (rpm) and bsdtar (libarchive-tools) on any host
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm libarchive-tools
          sudo gem install --no-document fpm

      - name: Build packages
        run: |
          ./packaging/build.sh "$BIN" "$VERSION" "${{ matrix.arch }}" ./dist
          ./packaging/pacman.sh "$BIN" "$VERSION" "${{ matrix.arch }}" ./dist
          ls -la ./dist/

      - name: Upload to Release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" ./dist/*.deb ./dist/*.rpm ./dist/*.zst --clobber
